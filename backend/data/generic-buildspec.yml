version: 0.2

phases:
  pre_build:
    commands:
      - |
        [ -z "$AWS_REGION" ]     && echo "ERROR: AWS_REGION is not set."     >&2 && exit 1 || true
        [ -z "$ECR_REPO_URI" ]   && echo "ERROR: ECR_REPO_URI is not set."   >&2 && exit 1 || true
        [ -z "$CONTAINER_NAME" ] && echo "ERROR: CONTAINER_NAME is not set." >&2 && exit 1 || true
        echo "All required environment variables are present."

      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REPO_URI"

      - IMAGE_TAG="${CODEBUILD_RESOLVED_SOURCE_VERSION:-latest}"
      - echo "Image tag -> $IMAGE_TAG"

      - docker pull "$ECR_REPO_URI:latest" || true

  build:
    commands:
      - echo "Building Docker image..."
      - |
        docker build \
          --cache-from "$ECR_REPO_URI:latest" \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          -t "$ECR_REPO_URI:$IMAGE_TAG" \
          -t "$ECR_REPO_URI:latest" \
          .

  post_build:
    commands:
      - echo "Pushing images to ECR..."
      - docker push "$ECR_REPO_URI:$IMAGE_TAG"
      - docker push "$ECR_REPO_URI:latest"

      # ── Generate imagedefinitions files ─────────────────────────────────────
      # Generates per-env files (imagedefinitions-dev/uat/prod.json) plus
      # a legacy imagedefinitions.json for backward compatibility.
      # The pipeline reads whichever filename its stage is configured for.
      #
      # SECURITY: Only SECRET_ARN_* (ARNs) and SECRET_KEYS_* (key names)
      # are used. Actual secret values never appear here.
      - |
        # Resolve per-env secrets (fallback to legacy SECRET_ARN if per-env not set)
        DEV_ARN="${SECRET_ARN_DEV:-$SECRET_ARN}"
        DEV_KEYS="${SECRET_KEYS_DEV:-$SECRET_KEYS}"
        UAT_ARN="${SECRET_ARN_UAT:-$DEV_ARN}"
        UAT_KEYS="${SECRET_KEYS_UAT:-$DEV_KEYS}"
        PROD_ARN="${SECRET_ARN_PROD:-$DEV_ARN}"
        PROD_KEYS="${SECRET_KEYS_PROD:-$DEV_KEYS}"

        EXECUTION_ROLE="${EXECUTION_ROLE_ARN:-}"
        TASK_ROLE="${TASK_ROLE_ARN:-$EXECUTION_ROLE}"
        LOG_GROUP="${LOG_GROUP_NAME:-/ecs/$CONTAINER_NAME}"
        CONTAINER_PORT="${CONTAINER_PORT:-3000}"

        # Build secrets JSON array from keys and ARN using pure bash
        build_secrets_json() {
          local ARN="$1"
          local KEYS_JSON="$2"
          if [ -z "$ARN" ] || [ "$ARN" = '""' ]; then
            echo "[]"
            return
          fi
          # Parse JSON array of keys and build ECS secrets format
          local RESULT=""
          local FIRST=true
          # Strip brackets and quotes, split by comma
          local CLEANED=$(echo "$KEYS_JSON" | sed 's/^\[//;s/\]$//;s/"//g;s/,/ /g')
          for KEY in $CLEANED; do
            if [ "$FIRST" = true ]; then
              FIRST=false
            else
              RESULT="$RESULT,"
            fi
            RESULT="$RESULT{\"name\":\"$KEY\",\"valueFrom\":\"$ARN:$KEY::\"}"
          done
          echo "[$RESULT]"
        }

        generate_taskdef() {
          local OUTPUT_FILE="$1"
          local SECRET_ARN_VAL="$2"
          local SECRET_KEYS_VAL="$3"

          if [ -n "$SECRET_ARN_VAL" ] && [ "$SECRET_ARN_VAL" != '""' ] && [ "$SECRET_ARN_VAL" != "" ]; then
            local SECRETS_JSON=$(build_secrets_json "$SECRET_ARN_VAL" "$SECRET_KEYS_VAL")
            printf '{
  "family": "%s",
  "requiresCompatibilities": ["FARGATE"],
  "networkMode": "awsvpc",
  "cpu": "256",
  "memory": "512",
  "executionRoleArn": "%s",
  "taskRoleArn": "%s",
  "containerDefinitions": [{
    "name": "%s",
    "image": "%s:%s",
    "essential": true,
    "portMappings": [{"containerPort": %s, "protocol": "tcp"}],
    "logConfiguration": {
      "logDriver": "awslogs",
      "options": {
        "awslogs-group": "%s",
        "awslogs-region": "%s",
        "awslogs-stream-prefix": "%s",
        "awslogs-create-group": "true"
      }
    },
    "secrets": %s
  }]
}' "$CONTAINER_NAME" "$EXECUTION_ROLE" "$TASK_ROLE" "$CONTAINER_NAME" "$ECR_REPO_URI" "$IMAGE_TAG" "$CONTAINER_PORT" "$LOG_GROUP" "$AWS_REGION" "$CONTAINER_NAME" "$SECRETS_JSON" > "$OUTPUT_FILE"
          else
            printf '[{"name":"%s","imageUri":"%s"}]' "$CONTAINER_NAME" "$ECR_REPO_URI:$IMAGE_TAG" > "$OUTPUT_FILE"
          fi
          echo "Generated $OUTPUT_FILE ($(wc -c < "$OUTPUT_FILE") bytes)"
        }

        # Generate per-env files
        generate_taskdef "imagedefinitions-dev.json"  "$DEV_ARN"  "$DEV_KEYS"
        generate_taskdef "imagedefinitions-uat.json"  "$UAT_ARN"  "$UAT_KEYS"
        generate_taskdef "imagedefinitions-prod.json" "$PROD_ARN" "$PROD_KEYS"

        # Legacy single file (uses DEV secrets for backward compat)
        generate_taskdef "imagedefinitions.json"      "$DEV_ARN"  "$DEV_KEYS"

      - docker rmi "$ECR_REPO_URI:$IMAGE_TAG" "$ECR_REPO_URI:latest" || true

artifacts:
  files:
    - imagedefinitions.json
    - imagedefinitions-dev.json
    - imagedefinitions-uat.json
    - imagedefinitions-prod.json
  discard-paths: yes
