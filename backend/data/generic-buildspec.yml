version: 0.2

phases:
  pre_build:
    commands:
      - echo "=== Validating environment variables ==="
      - test -n "$AWS_REGION"     || (echo "ERROR: AWS_REGION is not set" && exit 1)
      - test -n "$ECR_REPO_URI"   || (echo "ERROR: ECR_REPO_URI is not set" && exit 1)
      - test -n "$CONTAINER_NAME" || (echo "ERROR: CONTAINER_NAME is not set" && exit 1)
      - echo "All required environment variables are present."

      - echo "=== Auto-generating Dockerfile if not present ==="
      - |
        if [ -f Dockerfile ]; then
          echo "Dockerfile found in repo — using it."
        elif [ -f package.json ]; then
          echo "Node.js project detected — generating Dockerfile."
          printf '%s\n' 'FROM node:20-alpine' 'WORKDIR /app' 'COPY package*.json ./' 'RUN npm ci --only=production' 'COPY . .' 'EXPOSE 3000' 'CMD ["node", "index.js"]' > Dockerfile
        elif [ -f requirements.txt ] || [ -f pyproject.toml ]; then
          echo "Python project detected — generating Dockerfile."
          printf '%s\n' 'FROM python:3.11-slim' 'WORKDIR /app' 'COPY requirements*.txt ./' 'RUN pip install --no-cache-dir -r requirements.txt 2>/dev/null || true' 'COPY . .' 'EXPOSE 8000' 'CMD ["python", "app.py"]' > Dockerfile
        else
          echo "No Dockerfile or known framework detected — using generic nginx static site."
          printf '%s\n' 'FROM nginx:alpine' 'RUN rm /etc/nginx/conf.d/default.conf' 'COPY . /usr/share/nginx/html' 'EXPOSE 80' 'CMD ["nginx", "-g", "daemon off;"]' > Dockerfile
        fi
      - echo "=== Dockerfile in use ===" && cat Dockerfile

      - echo "=== Logging in to Amazon ECR ==="
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REPO_URI"
      - IMAGE_TAG="${CODEBUILD_RESOLVED_SOURCE_VERSION:-latest}"
      - echo "Image tag -> $IMAGE_TAG"
      - docker pull "$ECR_REPO_URI:latest" || true

  build:
    commands:
      - echo "=== Building Docker image ==="
      - docker build --cache-from "$ECR_REPO_URI:latest" --build-arg BUILDKIT_INLINE_CACHE=1 -t "$ECR_REPO_URI:$IMAGE_TAG" -t "$ECR_REPO_URI:latest" .

  post_build:
    commands:
      - echo "=== Pushing to ECR ==="
      - docker push "$ECR_REPO_URI:$IMAGE_TAG"
      - docker push "$ECR_REPO_URI:latest"
      - printf '[{"name":"%s","imageUri":"%s"}]' "$CONTAINER_NAME" "$ECR_REPO_URI:$IMAGE_TAG" > imagedefinitions.json
      - cat imagedefinitions.json
      - docker rmi "$ECR_REPO_URI:$IMAGE_TAG" "$ECR_REPO_URI:latest" || true

artifacts:
  files:
    - imagedefinitions.json
  discard-paths: yes
