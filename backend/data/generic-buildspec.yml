version: 0.2

phases:
  pre_build:
    commands:
      # ── 1. Validate required environment variables ──────────────────────────
      - |
        for VAR in AWS_REGION ECR_REPO_URI CONTAINER_NAME; do
          if [ -z "${!VAR:-}" ]; then
            echo "ERROR: Required environment variable '$VAR' is not set." >&2
            exit 1
          fi
        done
        echo "✔ All required environment variables are present."

      # ── 2. Authenticate to Amazon ECR ───────────────────────────────────────
      - echo "Logging in to Amazon ECR ($ECR_REPO_URI)..."
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REPO_URI"

      # ── 3. Set image tags ───────────────────────────────────────────────────
      - IMAGE_TAG="${CODEBUILD_RESOLVED_SOURCE_VERSION:-latest}"
      - echo "Image tag will be $IMAGE_TAG"

      # ── 4. Pull latest image for layer caching ─────────────────────────────
      - docker pull "$ECR_REPO_URI:latest" || true

  build:
    commands:
      # ── 5. Build Docker image (with layer cache) ────────────────────────────
      - echo "Building Docker image..."
      - |
        docker build \
          --cache-from "$ECR_REPO_URI:latest" \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          -t "$ECR_REPO_URI:$IMAGE_TAG" \
          -t "$ECR_REPO_URI:latest" \
          .

  post_build:
    commands:
      # ── 6. Push both tags to ECR ────────────────────────────────────────────
      - echo "Pushing Docker image to ECR..."
      - docker push "$ECR_REPO_URI:$IMAGE_TAG"
      - docker push "$ECR_REPO_URI:latest"

      # ── 7. Generate imagedefinitions.json for ECS deploy ───────────────────
      - echo "Generating imagedefinitions.json..."
      - |
        printf '[{"name":"%s","imageUri":"%s"}]' \
          "$CONTAINER_NAME" \
          "$ECR_REPO_URI:$IMAGE_TAG" \
          > imagedefinitions.json
      - echo "imagedefinitions.json contents:"
      - cat imagedefinitions.json

      # ── 8. Clean up local Docker images to free disk ────────────────────────
      - docker rmi "$ECR_REPO_URI:$IMAGE_TAG" "$ECR_REPO_URI:latest" || true

artifacts:
  files:
    - imagedefinitions.json
  discard-paths: yes
