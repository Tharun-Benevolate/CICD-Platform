version: 0.2

phases:
  pre_build:
    commands:
      # ── 1. Validate required environment variables ──────────────────────────
      - |
        [ -z "$AWS_REGION" ]     && echo "ERROR: AWS_REGION is not set."     >&2 && exit 1 || true
        [ -z "$ECR_REPO_URI" ]   && echo "ERROR: ECR_REPO_URI is not set."   >&2 && exit 1 || true
        [ -z "$CONTAINER_NAME" ] && echo "ERROR: CONTAINER_NAME is not set." >&2 && exit 1 || true
        echo "All required environment variables are present."

      # ── 2. Authenticate to Amazon ECR ───────────────────────────────────────
      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REPO_URI"

      # ── 3. Set image tag to commit SHA (immutable), fallback to 'latest' ────
      - IMAGE_TAG="${CODEBUILD_RESOLVED_SOURCE_VERSION:-latest}"
      - echo "Image tag -> $IMAGE_TAG"

      # ── 4. Pull latest for Docker layer cache (failure is OK if first run) ──
      - docker pull "$ECR_REPO_URI:latest" || true

  build:
    commands:
      # ── 5. Build Docker image with layer cache ───────────────────────────────
      - echo "Building Docker image..."
      - |
        docker build \
          --cache-from "$ECR_REPO_URI:latest" \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          -t "$ECR_REPO_URI:$IMAGE_TAG" \
          -t "$ECR_REPO_URI:latest" \
          .

  post_build:
    commands:
      # ── 6. Push both the commit-SHA tag and latest to ECR ───────────────────
      - echo "Pushing images to ECR..."
      - docker push "$ECR_REPO_URI:$IMAGE_TAG"
      - docker push "$ECR_REPO_URI:latest"

      # ── 7. Generate imagedefinitions.json ───────────────────────────────────
      # When SECRET_ARN is set, generates a FULL ECS task definition JSON
      # (with Secrets Manager references) so the pipeline's Deploy action
      # creates a new task def revision that includes all platform-configured
      # credentials. Without secrets, uses the simple name+imageUri format.
      #
      # SECURITY: Only SECRET_ARN (an ARN, not a secret value) and SECRET_KEYS
      # (key names like ["DB_HOST"], not values) are used here. Actual secret
      # values never appear in this buildspec or CodeBuild logs.
      - |
        if [ -n "$SECRET_ARN" ] && [ "$SECRET_ARN" != '""' ]; then
          echo "Generating imagedefinitions.json with Secrets Manager references..."
          EXECUTION_ROLE="${EXECUTION_ROLE_ARN:-}"
          TASK_ROLE="${TASK_ROLE_ARN:-$EXECUTION_ROLE}"
          LOG_GROUP="${LOG_GROUP_NAME:-/ecs/$CONTAINER_NAME}"
          CONTAINER_PORT="${CONTAINER_PORT:-3000}"

          # Build the secrets array using node (avoids complex shell escaping)
          SECRETS_ARRAY=$(echo "$SECRET_KEYS" | node -e "
            const keys = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            const arn = process.env.SECRET_ARN;
            console.log(JSON.stringify(keys.map(k => ({ name: k, valueFrom: arn + ':' + k + '::' }))));
          ")

          # Full task definition JSON — CodePipeline V1 ECS action uses this
          # to register a new task def revision with all settings intact.
          cat > imagedefinitions.json <<EOF_TASKDEF
{
  "family": "$CONTAINER_NAME",
  "requiresCompatibilities": ["FARGATE"],
  "networkMode": "awsvpc",
  "cpu": "256",
  "memory": "512",
  "executionRoleArn": "$EXECUTION_ROLE",
  "taskRoleArn": "$TASK_ROLE",
  "containerDefinitions": [{
    "name": "$CONTAINER_NAME",
    "image": "$ECR_REPO_URI:$IMAGE_TAG",
    "essential": true,
    "portMappings": [{
      "containerPort": $CONTAINER_PORT,
      "protocol": "tcp"
    }],
    "logConfiguration": {
      "logDriver": "awslogs",
      "options": {
        "awslogs-group": "$LOG_GROUP",
        "awslogs-region": "$AWS_REGION",
        "awslogs-stream-prefix": "$CONTAINER_NAME",
        "awslogs-create-group": "true"
      }
    },
    "secrets": $SECRETS_ARRAY
  }]
}
EOF_TASKDEF
          cat imagedefinitions.json
        else
          echo "Generating imagedefinitions.json (no secrets)..."
          printf '[{"name":"%s","imageUri":"%s"}]' "$CONTAINER_NAME" "$ECR_REPO_URI:$IMAGE_TAG" > imagedefinitions.json
          cat imagedefinitions.json
        fi

      # ── 8. Free disk space by removing local image layers ───────────────────
      - docker rmi "$ECR_REPO_URI:$IMAGE_TAG" "$ECR_REPO_URI:latest" || true

artifacts:
  files:
    - imagedefinitions.json
  discard-paths: yes
